[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "collaborative-ide-api-python"
version = "0.0.1"
description = "Python AI microservice for Collaborative IDE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-jose>=3.3.0",
    "boto3>=1.34.0",
    "langchain>=0.1.0",
    "langchain-aws>=0.1.0",
    "supabase>=2.3.0",
    "pgvector>=0.2.0",
    "python-multipart>=0.0.6",
    "sse-starlette>=2.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "types-python-jose>=3.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["collaborative_ide_api_python*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true