version: '3.8'

services:
  # PostgreSQL with pgvector for RAG
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ide-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ide
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ide"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Supabase (local development stack)
  # Uses official Supabase local dev image
  supabase:
    image: supabase/supabase:v2.19.4
    container_name: ide-supabase
    ports:
      - "54321:54321"  # Studio
      - "54322:54322"  # Auth
      - "54323:54323"  # Realtime
      - "54324:54324"  # REST
      - "54325:54325"  # Storage
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-token-with-at-least-32-characters}
      ANON_KEY: ${SUPABASE_ANON_KEY:-your-anon-key}
      SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-your-service-role-key}
      SITE_URL: http://localhost:3000
      ADDITIONAL_REDIRECT_URLS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Node.js API
  api-node:
    build:
      context: ..
      dockerfile: apps/api-node/Dockerfile
    container_name: ide-api-node
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      MONGODB_URI: mongodb://mongodb:27017/ide
      SUPABASE_URL: ${SUPABASE_URL:-http://supabase:54321}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID}
    depends_on:
      mongodb:
        condition: service_healthy
      supabase:
        condition: service_healthy
    volumes:
      - ../apps/api-node:/app/apps/api-node
      - ../packages/shared-types:/app/packages/shared-types

  # Python AI Service
  api-python:
    build:
      context: ..
      dockerfile: apps/api-python/Dockerfile
    container_name: ide-api-python
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      PORT: 8000
      SUPABASE_URL: ${SUPABASE_URL:-http://supabase:54321}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      PGVECTOR_CONNECTION_STRING: postgresql://postgres:postgres@postgres:5432/ide
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../apps/api-python:/app/apps/api-python

volumes:
  mongodb_data:
  postgres_data: